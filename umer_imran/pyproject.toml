[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrilift"
version = "1.0.0"
description = "AgriLift spatial and crop-health analytics"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "rasterio>=1.4,<2",
  "shapely>=2,<3",
  "pyproj>=3.7,<4",
  "h3>=4.1,<5",
  "portalocker>=2.10,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
  "click>=8.1,<9",
  "opencv-python-headless>=4.10,<5",
  "scipy>=1.11,<2",
  "scikit-image>=0.21,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
arosics = ["arosics>=1.13,<2"]

[tool.setuptools.packages.find]
include = ["agrilift_alignment*", "drone_alignment*", "crop_health_sentinel*"]

[tool.setuptools.package-data]
"crop_health_sentinel.config" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["drone_alignment/tests", "agrilift_alignment/tests", "crop_health_sentinel/tests"]
addopts = "-ra"
cache_dir = ".test-pytest-cache"
