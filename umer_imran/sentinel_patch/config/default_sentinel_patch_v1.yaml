sentinel_patch:
  enabled: false                       # master switch; the CLI --sentinel flag turns it on

  # Ordered provider chain. The first provider that yields an acceptable scene wins; a provider
  # that errors or finds nothing hands over to the next one. All free today.
  providers:
    - name: earth_search               # AWS, anonymous, no account
      stac_url: https://earth-search.aws.element84.com/v1
      collection: sentinel-2-c1-l2a
    - name: planetary_computer         # Azure, anonymous, URLs signed via the planetary-computer package
      stac_url: https://planetarycomputer.microsoft.com/api/stac/v1
      collection: sentinel-2-l2a
    - name: cdse                       # Copernicus Data Space, free account; credentials from env vars only
      enabled: false
  local_folder: null                   # if set, overrides the chain (offline / manually downloaded scenes)

  discovery:
    date_search_direction: both        # both | after_only | before_only
    preferred_gap_days: 3              # <= this: tier "same_period"
    acceptable_gap_days: 7             # <= this: tier "near"
    max_date_gap_days: 15              # <= this: tier "stale" (warning). Hard validation cap: 30
    prefilter_max_scene_cloud: 90      # eo:cloud_cover, only a cheap prefilter
    max_aoi_masked_fraction: 0.10      # <= 10 % of the AOI masked: accept, otherwise try the next date
    fallback_max_aoi_masked_fraction: 0.30   # no date passes: best scene up to 30 % masked, flagged "partial"
    min_clear_pixels: 100              # absolute floor for tiny AOIs (about 1 ha of clear 10 m pixels)
    scl_reject_classes: [0, 1, 3, 8, 9, 10, 11]
    cloud_mask_dilation_px: 2
    cloud_probability_threshold: 40
    max_candidates_evaluated: 20

  io:
    bands_10m: [B02, B03, B04, B08]
    bands_20m: [B05, B06, B07, B8A, B11, B12]
    aux: [SCL]
    registration_buffer_m: 300
    http_timeout_s: 60
    http_retries: 4
    cache_dir: null                    # default: <output>/sentinel/.cache

  reference:
    match_band: {drone: nir, sentinel: B08}
    holdout_band: {drone: red, sentinel: B04}
    psf_sigma_m: 5.0
    intermediate_gsd_m: 1.0
    min_pixel_valid_fraction: 0.95
    outlier_mad_factor: 50.0           # ignore drone cells this many robust sigmas from the median (edge overflow garbage)

  registration:
    max_shift_m: 25.0
    arosics_window_px: auto            # largest power of 2 <= min(window dims); at least 32
    ncc_search_px: 4                   # must exceed max_shift_m / 10 by at least one pixel
    arosics_mode: advisory             # off | advisory | veto. Advisory: reported and warned about, never rejects.
    arosics_min_reliability: 60        # AROSICS' own reliability (%); below it its result is not an opinion
    agreement_tolerance_px: 1.0        # |AROSICS - NCC| above this (when AROSICS is conclusive) counts as disagreement
    min_overlap_px: 400
    min_texture_score: 0.05            # coefficient of variation of the reference band (starting value)
    min_ncc_peak: 0.50
    min_peak_ratio: 1.15
    min_holdout_gain: 0.02
    quadrant_check_min_px: 48          # 480 m; typical fields are 200-700 m wide
    quadrant_tolerance_px: 0.5
    consensus:                         # several independent scenes must agree (small fields; see docs)
      enabled: true
      min_scenes: 3
      min_agree_fraction: 0.5
      agreement_radius_px: 1.0
      max_scenes: 10
      min_overlap_px: 100
      max_aoi_masked_fraction: 0.10
    large_shift_warning_m: 15.0        # LARGE_SHIFT_DRONE_FRAME_SUSPECT when positioning is gnss_only/unknown
    on_reject: publish_unshifted       # publish_unshifted | skip

  products:
    write_20m: true
    write_overlay: true
    overlay_gsd_m: 1.0
    align_grids: false
    write_crop_health_bands: true      # bands/B3.tif B4.tif B5.tif B8.tif SCL.tif
    compression: deflate

  drone_metadata:
    path_scan_depth: 3
    date_order: dmy                    # dmy | mdy, only for ambiguous numeric dates in folder names
    accept_path_date_estimate: false   # unattended runs: allow unambiguous, high-confidence estimates
    write_sidecar: true                # save confirmed / entered dates to flight.json
